name: Deploy Post Server (Java) to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      - name: Deploy to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/*.jar"
          target: "~/deploy/blog-post-server"
          strip_components: 1

      - name: Restart Application on EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          DB_SCHEMA: ${{ secrets.DB_SCHEMA }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: SPRING_DATASOURCE_URL,SPRING_DATASOURCE_USERNAME,SPRING_DATASOURCE_PASSWORD,DB_SCHEMA,JWT_SECRET,ALLOWED_ORIGINS
          script: |
            cd ~/deploy/blog-post-server
            # Create a stable symlink to the jar, explicitly excluding app.jar itself
            ln -sf $(ls *.jar | grep -v '\.original$' | grep -v 'app\.jar' | head -n 1) app.jar
            
            # Create an EnvironmentFile with only non-empty secrets
            > .env
            [ -n "$SPRING_DATASOURCE_URL" ] && echo "SPRING_DATASOURCE_URL=$SPRING_DATASOURCE_URL" >> .env
            [ -n "$SPRING_DATASOURCE_USERNAME" ] && echo "SPRING_DATASOURCE_USERNAME=$SPRING_DATASOURCE_USERNAME" >> .env
            [ -n "$SPRING_DATASOURCE_PASSWORD" ] && echo "SPRING_DATASOURCE_PASSWORD=$SPRING_DATASOURCE_PASSWORD" >> .env
            [ -n "${{ secrets.DB_SCHEMA }}" ] && echo "DB_SCHEMA=${{ secrets.DB_SCHEMA }}" >> .env
            [ -n "$JWT_SECRET" ] && echo "JWT_SECRET=$JWT_SECRET" >> .env
            [ -n "$ALLOWED_ORIGINS" ] && echo "ALLOWED_ORIGINS=$ALLOWED_ORIGINS" >> .env

            # Create systemd service dynamically
            sudo bash -c "cat > /etc/systemd/system/blog-post-server.service << 'EOF'
            [Unit]
            Description=Blog Post Server
            After=network.target

            [Service]
            User=ec2-user
            WorkingDirectory=/home/ec2-user/deploy/blog-post-server
            EnvironmentFile=/home/ec2-user/deploy/blog-post-server/.env
            ExecStart=/usr/bin/java -jar /home/ec2-user/deploy/blog-post-server/app.jar
            Restart=always
            SuccessExitStatus=143

            [Install]
            WantedBy=multi-user.target
            EOF"
            
            sudo systemctl daemon-reload
            sudo systemctl enable blog-post-server
            sudo systemctl restart blog-post-server
