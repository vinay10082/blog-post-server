spring.application.name=post-server

# Database Configuration (AWS Aurora PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/blog_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:blog_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:blog_password}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# Liquibase Configuration
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.default-schema=core
spring.jpa.properties.hibernate.default_schema=core

# Security Configuration
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200}
